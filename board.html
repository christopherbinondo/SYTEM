<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board view | Incident Desk</title>
<script>
  try {
    var t = localStorage.getItem('incident-desk-theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=26">
<link rel="stylesheet" href="desk.css?v=1">
</head>
<body>
<div class="content">
  <header class="bar">
    <div>
      <h1><i data-lucide="kanban"></i>Board view</h1>
      <p>Drag a report to another column to change its status. Urgent reports come first, oldest first.</p>
    </div>
  </header>
  <div id="alert" class="alert" hidden role="alert"></div>
  <div id="board" class="bd"></div>
</div>
<script src="core.js"></script>
<script>
const COLS = ['Pending', 'In Progress', 'Resolved'];
const card = r => '<article class="bd-card' + (r.urgent && r.status !== 'Resolved' ? ' urgent' : '') + '" draggable="true" data-id="' + r.id + '">' +
  '<div class="bd-top"><span class="id">' + r.id + '</span>' + tagU(r) + '</div><p>' + esc(r.description) + '</p>' +
  '<div class="small">' + esc(r.category) + ' · ' + esc(r.location) + ' · ' + relativeTime(r.created) + '</div>' +
  '<select class="bd-move" data-id="' + r.id + '" aria-label="Move ' + r.id + '">' + COLS.map(c => '<option' + (c === r.status ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></article>';
function pageRender() {
  showAlert();
  const list = insertionSort(records.toArray(), (a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || a.created - b.created);
  $('board').innerHTML = COLS.map(c => {
    const rs = list.filter(r => r.status === c);
    return '<section class="bd-col" data-col="' + c + '"><h3>' + c + ' <span class="small">' + rs.length + '</span></h3><div class="bd-list">' + rs.map(card).join('') + '</div></section>';
  }).join('');
  refreshIcons();
}
function move(id, to) {
  const r = records.findById(id);
  if (!r || r.status === to) { render(); return; }
  if (r.status === 'Pending' && to === 'Resolved' && !confirm('Mark ' + id + ' as Resolved without processing it?')) { render(); return; }
  const from = r.status;
  setStatus(r, to, true, { actor: 'board' });
  render();
  toast(id + ': ' + from + ' → ' + to, { actionLabel: 'Undo', onAction: () => undoLast() });
}
const bd = $('board');
bd.addEventListener('dragstart', e => { const c = e.target.closest('.bd-card'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('drag'); });
bd.addEventListener('dragend', e => { document.querySelectorAll('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });
bd.addEventListener('dragover', e => { const col = e.target.closest('.bd-col'); if (!col) return; e.preventDefault(); document.querySelectorAll('.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
bd.addEventListener('drop', e => { const col = e.target.closest('.bd-col'); if (!col) return; e.preventDefault(); move(e.dataTransfer.getData('text/plain'), col.dataset.col); });
bd.addEventListener('change', e => { if (e.target.classList.contains('bd-move')) move(e.target.dataset.id, e.target.value); });
render();
</script>
<script src="desk.js"></script>
</body>
</html>
